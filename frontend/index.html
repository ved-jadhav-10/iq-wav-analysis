<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Sanket</title>
    <meta name="description" content="Sanket: offline blind analysis of unknown IQ and WAV recordings, with the evidence for every result." />
    <script>
      try {
        var t = localStorage.getItem('sanket-theme')
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
