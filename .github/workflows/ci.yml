name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash stops on the first failing command on both platforms; Windows' default pwsh does not.
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix frontend

      - name: Python checks
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright
          uv run pytest -n auto --dist worksteal

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Licences and THIRD_PARTY.md
        run: uv run python tools/third_party.py --check

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit, Linux only)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: End-to-end smoke test (offline)
        working-directory: frontend
        run: npm run e2e
