# Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Recordings belong in data/ (git-ignored), never in git.
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  # Local hooks use the versions pinned in uv.lock and package-lock.json.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: third-party
        name: THIRD_PARTY.md up to date and licences allowed
        entry: uv run python tools/third_party.py --check
        language: system
        files: ^(uv\.lock|frontend/package-lock\.json|THIRD_PARTY\.md)$
        pass_filenames: false
