[project]
name = "sanket"
version = "0.1.0"
description = "Blind signal analysis, with evidence"
requires-python = ">=3.12,<3.13"
# ml/ is deliberately absent: training dependencies never enter the product install.
dependencies = ["sanket-backend", "sanket-dsp", "sanket-bench"]

[dependency-groups]
dev = [
 "httpx2",
 "jsonschema>=4.26.0",
 "pre-commit",
 "psutil>=6.0",
 "pyright",
 "pytest",
 "pytest-socket",
 "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["dsp", "ml", "backend", "bench"]

[tool.uv.sources]
sanket-backend = { workspace = true }
sanket-dsp = { workspace = true }
sanket-bench = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "bench", "dsp", "ml"]

[tool.pyright]
include = ["dsp/src", "ml/src", "backend/src", "bench/src", "tests", "tools"]
extraPaths = ["tools", "dsp/src", "ml/src", "backend/src", "bench/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["dsp/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# Tests may only open loopback connections: enforces "0 outbound connections" (PLAN §2).
# "slow" tests (multi-GB scale runs) are excluded by default: run them with `-m slow`, matching
# how bench's null/sealed sets aren't run during ordinary development either.
addopts = ["--import-mode=importlib", "--allow-hosts=127.0.0.1,::1", "-m", "not slow"]
markers = ["slow: writes multi-GB files and/or takes minutes; run explicitly with -m slow"]
